apiVersion: v1
kind: Service
metadata:
    labels:
        app.kubernetes.io/instance: external-outpost
        app.kubernetes.io/name: authentik-outpost
    name: authentik-outpost
    namespace: authentik
spec:
    ports:
        - name: http
          port: 9000
          protocol: TCP
          targetPort: http
        - name: https
          port: 9443
          protocol: TCP
          targetPort: https
    type: ClusterIP
    selector:
        app.kubernetes.io/instance: external-outpost
        app.kubernetes.io/name: authentik-outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/instance: external-outpost
        app.kubernetes.io/name: authentik-outpost
    name: authentik-outpost
    namespace: authentik
spec:
    revisionHistoryLimit: 1
    selector:
        matchLabels:
            app.kubernetes.io/instance: external-outpost
            app.kubernetes.io/name: authentik-outpost
    template:
        metadata:
            labels:
                app.kubernetes.io/instance: external-outpost
                app.kubernetes.io/name: authentik-outpost
        spec:
            containers:
                - name: proxy
                  image: ghcr.io/goauthentik/proxy:2026.2.1
                  ports:
                      - containerPort: 9000
                        name: http
                        protocol: TCP
                      - containerPort: 9443
                        name: https
                        protocol: TCP
                  envFrom:
                      - secretRef:
                            name: authentik-outpost-api