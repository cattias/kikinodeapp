apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: speedtest-router
  namespace: speed
spec:
  entryPoints:
    - websecure
  routes:
    # --- API Bypass (Higher Priority) ---
    - match: Host(`speedtest.node.attias.io`) && PathPrefix(`/api/`)
      kind: Rule
      priority: 100
      middlewares:
        - name: internal-only
          namespace: traefik
      services:
        - name: glances
          port: 8765
    - match: Host(`speedtest.node.attias.io`)
      kind: Rule
      services:
        - name: speedtest
          port: 8765
      priority: 10
      middlewares:
        - name: authentik
          namespace: traefik
    - kind: Rule
      match: "Host(`speedtest.node.attias.io`) && PathPrefix(`/outpost.goauthentik.io/`)"
      priority: 15
      services:
          - kind: Service
            name: authentik-outpost
            namespace: authentik
            port: 9000
  tls:
    certResolver: le