apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: speedtest-router
  namespace: speed
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`speedtest.node.attias.io`)
      kind: Rule
      services:
        - name: speedtest
          port: 8765
      priority: 10
      middlewares:
        - name: authentik
          namespace: traefik
    - kind: Rule
      match: "Host(`speedtest.node.attias.io`) && PathPrefix(`/outpost.goauthentik.io/`)"
      priority: 15
      services:
          - kind: Service
            name: authentik-outpost
            namespace: authentik
            port: 9000
  tls:
    certResolver: le